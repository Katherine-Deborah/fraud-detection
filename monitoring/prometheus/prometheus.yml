# Scrape targets for the fraud detection stack.
#
# fraud-gateway: the FastAPI gateway (serving/app.py) is now the
# fastapi-gateway compose service (Session 10 -- previously a local host
# process scraped via host.docker.internal, see git history of this file),
# reachable by its service name on the compose network like every other
# service here.
#
# triton: already a compose service, reachable by its service name on the
# compose network. Port 8002 is Triton's built-in Prometheus metrics
# endpoint (docker-compose.yml has exposed it since Session 8; this is the
# "wired up properly in Session 9" it referred to).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: fraud-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["fastapi-gateway:8090"]

  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:8002"]
