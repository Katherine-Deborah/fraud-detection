# Services are added incrementally, session by session, per SESSIONS.md.
# Session 0: verified docker compose works locally with a hello-world stub.
# Planned additions:
#   Session 2  -> kafka (KRaft mode, no Zookeeper)
#   Session 3  -> redis
#   Session 4  -> postgres, airflow-init, airflow-webserver, airflow-scheduler
#   Session 5  -> mlflow
#   Session 8  -> triton (fastapi gateway runs as a local process for now,
#                 like producer/consumer -- containerizing it is Session 10's
#                 job when the full compose file gets finalized)
#   Session 9  -> prometheus, grafana  <- this session

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env, see .env.example}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?set AIRFLOW_WEBSERVER_SECRET_KEY in .env, see .env.example}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # Read by dags/fraud_pipeline_dag.py to find the mounted project code,
    # and by feature_store/store_utils.py to reach Redis via the compose
    # network's service name instead of the host-only localhost:6380
    # (see that file's docstring for why the two must differ).
    PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    FEAST_REDIS_CONNECTION_STRING: redis:6379
  volumes:
    &airflow-common-volumes
    - ./dags:/opt/airflow/dags
    - ./validation:/opt/airflow/project/validation
    - ./data_generation:/opt/airflow/project/data_generation
    - ./feature_store:/opt/airflow/project/feature_store
    - ./data:/opt/airflow/project/data
    # Session 9: the drift_report task imports training.data_prep for its
    # feature-matrix schema (FEATURE_COLUMNS/build_feature_matrix) rather
    # than duplicating that logic -- see dags/fraud_pipeline_dag.py. Only
    # data_prep.py's non-sklearn helpers are actually used, but the whole
    # directory is mounted to match every other volume in this block
    # (one mount per source directory, not per file).
    - ./training:/opt/airflow/project/training
    # drift_report writes its HTML/JSON reports here. Without this mount,
    # PROJECT_ROOT/monitoring doesn't exist as a real path inside the
    # container at all (it isn't backed by any bind mount), and mkdir on it
    # fails with a permission error rather than "not found" -- caught by
    # actually running the task, not by inspection.
    - ./monitoring:/opt/airflow/project/monitoring
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      # Mapped to host port 6380, not the default 6379: this machine's WSL
      # Ubuntu distro already runs its own unrelated redis-server on
      # 127.0.0.1:6379 (predates this project), and WSL2's localhost-
      # forwarding made Windows-side clients connect to *that* one instead
      # of this container's, silently. Using 6380 avoids the collision
      # entirely rather than depending on the other process being absent.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.0
    container_name: fraud-kafka
    ports:
      # Exposed to the host so producer/consumer scripts run as local
      # python processes (not containerized) can connect directly.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: fraud-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      # Unlike Kafka/Redis, this is *not* meant to be ephemeral -- DAG run
      # history should survive a `docker compose down` between demo runs.
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    container_name: fraud-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: fraud-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  airflow-scheduler:
    <<: *airflow-common
    container_name: fraud-airflow-scheduler
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    container_name: fraud-mlflow
    # SQLite backend store (not Postgres): a single-node local demo doesn't
    # need a second Postgres-backed service coupled to Airflow's -- this
    # keeps MLflow's lifecycle independent, matching the project's pattern
    # of adding only what each session needs. Both the backend DB and the
    # artifact store live under one named volume so runs/artifacts survive
    # `docker compose down`.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  triton:
    # CPU mode (PROJECT.md: "CPU mode is fine if no local GPU") -- no GPU
    # reservation, config.pbtxt's instance_group is KIND_CPU. This image is
    # large (multi-GB); the first `docker compose up` pulls it once.
    image: nvcr.io/nvidia/tritonserver:24.09-py3
    container_name: fraud-triton
    command: tritonserver --model-repository=/models
    volumes:
      # Read-only: the model repo is written by training/export_to_onnx.py
      # on the host, Triton only ever reads it.
      - ./serving/triton_model_repo:/models:ro
    ports:
      - "8000:8000"  # HTTP inference
      - "8001:8001"  # gRPC inference
      - "8002:8002"  # Prometheus metrics -- scraped by the prometheus service below
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/v2/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: fraud-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    # host.docker.internal (used by prometheus.yml to scrape the FastAPI
    # gateway, which runs as a local host process -- see serving/app.py's
    # module docstring) resolves out of the box on Docker Desktop for
    # Windows/Mac. No extra_hosts entry needed here.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    container_name: fraud-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Provisioned dashboard should be the thing a demo lands on, not an
      # empty home screen.
      GF_DEFAULT_APP_MODE: production
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      # Datasource + dashboard provisioning -- the dashboard exists and is
      # wired to Prometheus the moment the container starts, no manual
      # click-through setup required for the demo.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  airflow-postgres-data:
  mlflow-data:
  prometheus-data:
  grafana-data:
