# Services are added incrementally, session by session, per SESSIONS.md.
# Session 0: verified docker compose works locally with a hello-world stub.
# Planned additions:
#   Session 2  -> kafka (KRaft mode, no Zookeeper)               <- this session
#   Session 3  -> redis
#   Session 4  -> airflow-webserver, airflow-scheduler, postgres (metadata DB)
#   Session 5  -> mlflow
#   Session 8  -> triton, fastapi gateway
#   Session 9  -> prometheus, grafana

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: fraud-kafka
    ports:
      # Exposed to the host so producer/consumer scripts run as local
      # python processes (not containerized) can connect directly.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
