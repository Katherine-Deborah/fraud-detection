# Services are added incrementally, session by session, per SESSIONS.md.
# Session 0: verified docker compose works locally with a hello-world stub.
# Planned additions:
#   Session 2  -> kafka (KRaft mode, no Zookeeper)
#   Session 3  -> redis
#   Session 4  -> postgres, airflow-init, airflow-webserver, airflow-scheduler  <- this session
#   Session 5  -> mlflow  <- this session
#   Session 8  -> triton, fastapi gateway
#   Session 9  -> prometheus, grafana

x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env, see .env.example}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:?set AIRFLOW_WEBSERVER_SECRET_KEY in .env, see .env.example}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # Read by dags/fraud_pipeline_dag.py to find the mounted project code,
    # and by feature_store/store_utils.py to reach Redis via the compose
    # network's service name instead of the host-only localhost:6380
    # (see that file's docstring for why the two must differ).
    PROJECT_ROOT: /opt/airflow/project
    PYTHONPATH: /opt/airflow/project
    FEAST_REDIS_CONNECTION_STRING: redis:6379
  volumes:
    &airflow-common-volumes
    - ./dags:/opt/airflow/dags
    - ./validation:/opt/airflow/project/validation
    - ./data_generation:/opt/airflow/project/data_generation
    - ./feature_store:/opt/airflow/project/feature_store
    - ./data:/opt/airflow/project/data
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      # Mapped to host port 6380, not the default 6379: this machine's WSL
      # Ubuntu distro already runs its own unrelated redis-server on
      # 127.0.0.1:6379 (predates this project), and WSL2's localhost-
      # forwarding made Windows-side clients connect to *that* one instead
      # of this container's, silently. Using 6380 avoids the collision
      # entirely rather than depending on the other process being absent.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.0
    container_name: fraud-kafka
    ports:
      # Exposed to the host so producer/consumer scripts run as local
      # python processes (not containerized) can connect directly.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: fraud-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      # Unlike Kafka/Redis, this is *not* meant to be ephemeral -- DAG run
      # history should survive a `docker compose down` between demo runs.
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    container_name: fraud-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: fraud-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  airflow-scheduler:
    <<: *airflow-common
    container_name: fraud-airflow-scheduler
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.2
    container_name: fraud-mlflow
    # SQLite backend store (not Postgres): a single-node local demo doesn't
    # need a second Postgres-backed service coupled to Airflow's -- this
    # keeps MLflow's lifecycle independent, matching the project's pattern
    # of adding only what each session needs. Both the backend DB and the
    # artifact store live under one named volume so runs/artifacts survive
    # `docker compose down`.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  airflow-postgres-data:
  mlflow-data:
